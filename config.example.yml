####################################################################
# PitLane Server Agent — Configuration
# Ce fichier est utilisé comme template par install.ps1
# Les chemins sont remplis automatiquement à l'installation
# Seuls jwt_secret et base_url sont à renseigner manuellement
####################################################################

http:
  host: 0.0.0.0
  port: 8180
  base_url: https://ton-serveur.example.com

game:
  install_path: INSTALL_PATH
  executable_name: AssettoCorsaEVOServer.exe
  configs_path: CONFIGS_PATH
  results_path: RESULTS_PATH

instances:
  - id: server1
    name: "Serveur principal"
    tcp_port: 9700
    udp_port: 9700
    http_port: 8080

auth:
  jwt_secret: CHANGE_ME_SAME_AS_APP_SECRET_SYMFONY
  jwt_algorithm: HS256

logging:
  logs_path: LOGS_PATH
  max_lines: 500