####################################################################
# PitLane Agent - Configuration template
####################################################################

http:
  host: 0.0.0.0
  port: 8181
  base_url: __BASE_URL__

game:
  install_path: __INSTALL_PATH__
  executable_name: AssettoCorsaEVOServer.exe
  configs_path: __CONFIGS_PATH__
  results_path: __RESULTS_PATH__

steam:
  steamcmd_path: __STEAMCMD_PATH__
  app_id: 4564210
  appmanifest_path: __APPMANIFEST_PATH__

hubs:
  - name: production
    enabled: true
    required: true
    base_url: https://pitlane-evo.fr
    runtime_report_endpoint: /api/agent/runtime-report
    websocket_endpoint: /api/agent/ws
    websocket_enabled: true
    runtime_report_interval: 1
    instance_http_timeout: 0.5

    # Optional dedicated token.
    # Falls back to auth.jwt_secret when omitted.
    # agent_token: your-token

  # Example local development mirror.
  # - name: local-dev
  #   enabled: true
  #   required: false
  #   base_url: https://your-dev-tunnel.trycloudflare.com
  #   runtime_report_endpoint: /api/agent/runtime-report
  #   websocket_endpoint: /api/agent/ws
  #   websocket_enabled: true
  #   runtime_report_interval: 1
  #   instance_http_timeout: 0.5

auth:
  jwt_secret: __JWT_SECRET__
  jwt_algorithm: HS256

logging:
  logs_path: __LOGS_PATH__
  max_lines: 500
