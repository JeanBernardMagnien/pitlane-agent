####################################################################
# PitLane Agent - Configuration template
# This file is used by the installers to generate config.yml
# It is removed after installation.
####################################################################

http:
  host: 0.0.0.0
  port: 8181
  base_url: __BASE_URL__

game:
  install_path: __INSTALL_PATH__
  executable_name: AssettoCorsaEVOServer.exe
  configs_path: __CONFIGS_PATH__
  results_path: __RESULTS_PATH__

steam:
  steamcmd_path: __STEAMCMD_PATH__
  app_id: 4564210
  appmanifest_path: __APPMANIFEST_PATH__

# Backward compatible single hub config.
# Existing installations continue to work with this section.
hub:
  base_url: https://pitlane-evo.fr
  runtime_report_endpoint: /api/agent/runtime-report
  runtime_report_interval: 10
  instance_http_timeout: 0.5

# Optional multi-hub runtime mirroring.
# Useful to push runtime reports to production + local development hub.
#
# hubs:
#   - name: production
#     enabled: true
#     required: true
#     base_url: https://pitlane-evo.fr
#
#   - name: local-dev
#     enabled: true
#     required: false
#     base_url: https://your-dev-tunnel.trycloudflare.com
#
# A global token from `hub.agent_token` / `hub.token`
# is automatically reused when a hub has no dedicated token.

auth:
  jwt_secret: __JWT_SECRET__
  jwt_algorithm: HS256

logging:
  logs_path: __LOGS_PATH__
  max_lines: 500
