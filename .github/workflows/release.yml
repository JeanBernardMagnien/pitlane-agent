name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Créer agent.zip
        run: |
          cd agent
          zip -r ../agent.zip .

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: agent.zip